name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Verify tag version
        run: |
          PACKAGE_VERSION="$(uv run python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - run: uv build
      - name: Smoke-test wheel
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${WHEEL}"
          SMOKE_DIR="$(mktemp -d)"
          uv venv "${SMOKE_DIR}"
          uv pip install --python "${SMOKE_DIR}/bin/python" "${WHEEL}"
          "${SMOKE_DIR}/bin/paperless-ngx-mcp" --version
      - name: Create checksums
        run: shasum -a 256 dist/* > dist/SHA256SUMS
      - name: Extract release notes from changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\] - " { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file release-notes.md --verify-tag
