[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-paperless-ngx-mcp"
version = "0.1.0"
description = "Local FastMCP server for a Paperless-ngx instance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Frank Herchet" }]
keywords = ["mcp", "paperless-ngx", "fastmcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastmcp>=3.4.4,<4",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
paperless-ngx-mcp = "paperless_ngx_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_ngx_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastmcp.*"]
follow_untyped_imports = true
